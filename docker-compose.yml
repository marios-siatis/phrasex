services:
  db:
    image: postgres:16-alpine
    container_name: phrasex-postgres
    environment:
      POSTGRES_DB: phrasex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - phrasex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phrasex"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  phrasex-postgres:
