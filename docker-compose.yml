services:
  db:
    image: postgres:16-alpine
    container_name: phrasex-postgres
    environment:
      POSTGRES_DB: phrasex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - phrasex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phrasex"]
      interval: 5s
      timeout: 5s
      retries: 12

  scheduler:
    build: ./lambda
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/phrasex
      THRESHOLD_HOURS: '1'
      POLL_INTERVAL_SECONDS: '300'
      RUN_ONCE: 'false'
      INSTAGRAM_GRAPH_VERSION: '16.0'
    depends_on:
      - db

volumes:
  phrasex-postgres:
